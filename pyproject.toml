[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-claude"
version = "2.7.6"
description = "Autonomous multi-agent coding framework with web interface"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Auto Claude Team", email = "119136210+AndyMik90@users.noreply.github.com"}
]
keywords = [
    "ai",
    "coding",
    "agent",
    "autonomous",
    "claude",
    "anthropic",
    "llm",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "claude-agent-sdk>=0.1.39",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "sentry-sdk>=2.0.0",
    # Web server dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Memory system (requires Python 3.12+)
memory = [
    "real_ladybug>=0.13.0; python_version >= '3.12'",
    "graphiti-core>=0.5.0; python_version >= '3.12'",
    "pandas>=2.2.0; python_version >= '3.12'",
]
# Google AI (for Gemini LLM and embeddings)
google = [
    "google-generativeai>=0.8.0",
]
# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# All optional dependencies
all = [
    "auto-claude[memory,google,dev]",
]

[project.scripts]
auto-claude = "cli.main:main"

[project.urls]
Homepage = "https://github.com/AndyMik90/Auto-Claude"
Documentation = "https://github.com/AndyMik90/Auto-Claude#readme"
Repository = "https://github.com/AndyMik90/Auto-Claude.git"
Issues = "https://github.com/AndyMik90/Auto-Claude/issues"

[tool.setuptools.packages.find]
where = ["apps/backend"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "web/static/**/*"]

# Include web static files
[tool.setuptools.include-package-data]
include-package-data = true

[[tool.setuptools.package-dir]]
"" = "apps/backend"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
